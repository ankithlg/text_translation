<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Language Translator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #6dd5ed, #2193b0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .translator-card {
            background-color: rgba(0,0,0,0.7);
            padding: 2rem;
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
        }
        select, textarea {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="translator-card">
        <h2 class="text-center mb-4">🌎 Language Translator</h2>
        <form method="POST">
            <div class="mb-3">
                <textarea class="form-control" name="input_text" rows="4" placeholder="Enter text to translate..." required></textarea>
            </div>
            <div class="row">
                <div class="col">
                    <select class="form-select" name="src_lang" required>
                        {% for code, language in languages.items() %}
                            <option value="{{ code }}">{{ language.title() }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col">
                    <select class="form-select" name="dest_lang" required>
                        {% for code, language in languages.items() %}
                            <option value="{{ code }}">{{ language.title() }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="d-grid mt-3">
                <button type="submit" class="btn btn-primary">Translate 🔄</button>
            </div>
        </form>

        {% if translated_text %}
        <div class="mt-4">
            <h5>Translated Text:</h5>
            <div class="alert alert-success" role="alert">
                {{ translated_text }}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
